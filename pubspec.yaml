name: mop_flutterflow
description: Custom FlutterFlow code for MOP — actions, widgets, and auth services.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase client — DB queries, RPC calls, Edge Function invocation
  supabase_flutter: ^2.8.0

  # Yoma OIDC SSO login flow
  flutter_appauth: ^8.0.1
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.3.3

  # Carbon proof photo processing
  image: ^4.3.0

  # QR code rendering (MopDynamicQRGenerator widget)
  qr_flutter: ^4.1.0

  # HTTP — Gupshup OTP, Climatiq carbon-math calls
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
